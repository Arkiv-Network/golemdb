[workspace]
resolver = "2"
members = [
    "crates/cells",
    "crates/immutable-data",
    "crates/storage",
    "crates/storage-mdbx",
    "crates/merkle",
    "crates/index",
    "crates/branch",
    "crates/record",
    "crates/api",
    "crates/query",
    "crates/integration-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
# Internal crates, referenced by member crates as `{ workspace = true }`.
golemdb-cells = { path = "crates/cells", version = "0.1.0" }
golemdb-immutable-data = { path = "crates/immutable-data", version = "0.1.0" }
golemdb-storage = { path = "crates/storage", version = "0.1.0" }
golemdb-storage-mdbx = { path = "crates/storage-mdbx", version = "0.1.0" }
golemdb-merkle = { path = "crates/merkle", version = "0.1.0" }
golemdb-index = { path = "crates/index", version = "0.1.0" }
golemdb-branch = { path = "crates/branch", version = "0.1.0" }
golemdb-record = { path = "crates/record", version = "0.1.0" }
golemdb-api = { path = "crates/api", version = "0.1.0" }
golemdb-query = { path = "crates/query", version = "0.1.0" }

# Common external dependencies.
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
criterion = "0.5"
proptest = "1"
# Pinned exactly, not `0.11`. Roaring's internal representation rules — the 4096
# array/bitset threshold, `optimize()`'s size comparisons, the serialized header
# layout — decide the bytes we hash into the Merkle trie, and none of them are
# covered by its public API contract. A patch bump can therefore change every root
# hash.
roaring = "=0.11.5"
