[workspace]
resolver = "2"
members = [
    "crates/cells",
    "crates/storage",
    "crates/storage-mdbx",
    "crates/merkle",
    "crates/index",
    "crates/branch",
    "crates/record",
    "crates/api",
    "crates/query",
    "crates/integration-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
# Internal crates, referenced by member crates as `{ workspace = true }`.
golemdb-cells = { path = "crates/cells", version = "0.1.0" }
golemdb-storage = { path = "crates/storage", version = "0.1.0" }
golemdb-storage-mdbx = { path = "crates/storage-mdbx", version = "0.1.0" }
golemdb-merkle = { path = "crates/merkle", version = "0.1.0" }
golemdb-index = { path = "crates/index", version = "0.1.0" }
golemdb-branch = { path = "crates/branch", version = "0.1.0" }
golemdb-record = { path = "crates/record", version = "0.1.0" }
golemdb-api = { path = "crates/api", version = "0.1.0" }
golemdb-query = { path = "crates/query", version = "0.1.0" }

# Common external dependencies.
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
criterion = "0.5"
proptest = "1"
