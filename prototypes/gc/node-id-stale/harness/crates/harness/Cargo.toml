[package]
name = "golemdb-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
golemdb-api = { path = "../../golem-db/crates/api" }
anyhow = "1"
hdrhistogram = "7"
# Same version as golem-db's storage; only reads per-table stats (see tables.rs).
libmdbx = "=0.6.6"
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
golemdb-storage = { path = "../../golem-db/crates/storage" }
golemdb-storage-mdbx = { path = "../../golem-db/crates/storage-mdbx" }
golemdb-branch = { path = "../../golem-db/crates/branch" }
golemdb-merkle = { path = "../../golem-db/crates/merkle" }
golemdb-cells = { path = "../../golem-db/crates/cells" }
golemdb-index = { path = "../../golem-db/crates/index" }
