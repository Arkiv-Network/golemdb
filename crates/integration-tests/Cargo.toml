[package]
name = "golemdb-integration-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# For the shared workload in src/workload.rs, used by tests and benches.
golemdb-api.workspace = true

[dev-dependencies]
golemdb-branch.workspace = true
golemdb-cells.workspace = true
golemdb-index.workspace = true
golemdb-merkle.workspace = true
golemdb-record.workspace = true
golemdb-storage.workspace = true
golemdb-storage-mdbx.workspace = true
proptest.workspace = true
criterion.workspace = true
# CPU time for the batch benchmark.
libc = "0.2"
# Reads Criterion's saved results for the batch benchmark's summary.
serde_json = "1"
tempfile = "3"

[[bench]]
name = "batch"
harness = false

[[bench]]
name = "index"
harness = false
